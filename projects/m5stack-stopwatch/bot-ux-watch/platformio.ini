[env:m5stack-stopwatch]
platform = espressif32@6.13.0
board = esp32s3box
framework = arduino
extra_scripts = post:tools/patch_m5gfx.py
lib_deps =
    https://github.com/m5stack/M5Unified.git#8530f5377d782e4a25a6c482de2e71c3f75ca8eb
    https://github.com/m5stack/M5GFX.git#d91077b9a607b59404e4e4a49f775c792bfae382
    https://github.com/m5stack/M5PM1.git#be9a5456c007c333e7ac963f33bfde1ffa5d82ee
    https://github.com/m5stack/M5IOE1.git#846eec7d05e25c09013be2acdb8804487f48a62e
lib_extra_dirs =
    ../../shared-libs
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
