[env:m5stack-core2]
platform = espressif32@6.13.0
board = m5stack-core2
framework = arduino
lib_deps =
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    bblanchon/ArduinoJson@7.4.3
lib_extra_dirs =
    ../../shared-libs
build_flags =
    -DBOARD_HAS_PSRAM
board_build.partitions = default_16MB.csv
monitor_speed = 115200
