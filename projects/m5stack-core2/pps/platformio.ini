[env:m5stack-core2]
platform = espressif32@6.13.0
board = m5stack-core2
framework = arduino
lib_deps =
    m5stack/M5Unified@0.2.21
    m5stack/M5GFX@0.2.28
    lvgl/lvgl@8.3.10
board_build.partitions = default_16MB.csv
upload_speed = 115200
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -I include
    -D LV_CONF_INCLUDE_SIMPLE
    -D LV_LVGL_H_INCLUDE_SIMPLE
    -D LCD_HEIGHT=240
    -D LCD_WIDTH=320
    -D LV_TICK_PERIOD_MS=2
